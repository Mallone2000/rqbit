name: Release binaries for Windows

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Tauri
        run: cargo install tauri-cli --locked --version 2.8.4

      - name: npm install (desktop)
        working-directory: desktop
        run: npm ci

      - name: npm install (librqbit/webui)
        working-directory: crates/librqbit/webui
        run: npm ci

      - name: cargo tauri build
        working-directory: desktop
        run: cargo tauri build --ci

      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            target/release/bundle/msi/rqbit-desktop_*_x64_en-US.msi

      - name: Build release
        run: cargo build --profile release-github

      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            target/release-github/rqbit.exe
