name: Build and release main

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.symlinks
  GIT_CONFIG_VALUE_0: "false"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      msi-version: ${{ steps.version.outputs.msi-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check release version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          version = manifest["workspace"]["package"]["version"]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)-servarr\.(\d+)", version)
          if not match:
              raise SystemExit(f"Unexpected workspace version: {version}")

          before = os.environ["BEFORE"]
          if before != "0" * 40:
              previous = subprocess.check_output(
                  ["git", "show", f"{before}:Cargo.toml"], text=True
              )
              old_version = tomllib.loads(previous)["workspace"]["package"]["version"]
              old_match = re.fullmatch(
                  r"(\d+)\.(\d+)\.(\d+)-servarr\.(\d+)", old_version
              )
              if not old_match or tuple(map(int, match.groups())) <= tuple(
                  map(int, old_match.groups())
              ):
                  raise SystemExit(f"Version must increase on main: {old_version} -> {version}")

          for name, dependency in manifest["workspace"]["dependencies"].items():
              if isinstance(dependency, dict) and "path" in dependency:
                  if dependency.get("version") != version:
                      raise SystemExit(f"{name} has a mismatched version")

          lock = tomllib.loads(Path("Cargo.lock").read_text())
          for package in lock["package"]:
              if "source" not in package and package["version"] != version:
                  raise SystemExit(f"{package['name']} has a mismatched lockfile version")

          # MSI versions cannot contain the fork's textual prerelease suffix.
          msi_parts = tuple(map(int, match.groups()))
          if any(part > limit for part, limit in zip(msi_parts, (255, 255, 65535, 65535))):
              raise SystemExit(f"Version exceeds MSI limits: {version}")
          msi_version = ".".join(map(str, msi_parts))

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag=v{version}", file=output)
              print(f"msi-version={msi_version}", file=output)
          PY

      - name: Reject an existing release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Release tag $RELEASE_TAG already exists" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi

  release-linux:
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Tauri
        run: cargo install tauri-cli --locked --version 2.8.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend workspace dependencies
        run: npm ci

      - name: cargo tauri build
        working-directory: desktop
        run: cargo tauri build --ci

      - name: Move files
        run: |
          mkdir -p builds
          find target/ -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -print0 |
          while IFS= read -r -d '' file; do
              mv "$file" ${{ github.workspace }}/builds/
          done
          mv target/release/rqbit-desktop ${{ github.workspace }}/builds/rqbit-desktop-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop-linux-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/builds/*
          if-no-files-found: error

  build-docker-cross:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/arm/v7, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: builder1

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            usr-local-cargo-git-db
            usr-local-cargo-registry-cache
            usr-local-cargo-registry-index
            src-target
          key: docker-xx-v1-${{ matrix.platform }}-release
          save-always: true

      - name: inject cache into docker
        uses: reproducible-containers/buildkit-cache-dance@63c59a3e6c6bd7fe55abecb23afd8e1121451230 # v3.1.0
        with:
          cache-map: |
            {
              "usr-local-cargo-git-db": "/usr/local/cargo/git/db",
              "usr-local-cargo-registry-cache": "/usr/local/cargo/registry/cache",
              "usr-local-cargo-registry-index": "/usr/local/cargo/registry/index",
              "src-target": "/src/target"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: cross-compile the binary
        run: |
          set -e

          mkdir -p target/cross
          docker buildx ls

          mkdir -p target/cross/${{ matrix.platform }}
          docker build --builder ${{ steps.builder1.outputs.name }} \
            --platform ${{ matrix.platform }} \
            -f docker/Dockerfile.xx \
            --output type=local,dest=target/cross/${{ matrix.platform }} ./

      - name: list files
        run: find target/cross/

      - name: generate-archive-key
        id: gen_artifact_key
        run: |
          echo "key=$(echo ${{ matrix.platform }} | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: copy binary for release
        run: |
          cd target/cross
          cp -l ${{ matrix.platform }}/rqbit rqbit-${{ steps.gen_artifact_key.outputs.key }}

      - name: Archive target/cross/
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.gen_artifact_key.outputs.key }}
          path: target/cross/${{ matrix.platform }}/

      - name: Archive release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cli-${{ steps.gen_artifact_key.outputs.key }}
          path: target/cross/rqbit-${{ steps.gen_artifact_key.outputs.key }}
          if-no-files-found: error

  release-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Tauri
        run: cargo install tauri-cli --locked --version 2.8.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend workspace dependencies
        run: npm ci

      - name: cargo tauri build
        working-directory: desktop
        env:
          MSI_VERSION: ${{ needs.check-version.outputs.msi-version }}
        run: |
          $config = @{ bundle = @{ windows = @{ wix = @{ version = $env:MSI_VERSION } } } }
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-windows.json"
          $config | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath
          cargo tauri build --ci --config $configPath

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop-windows
          path: target/release/bundle/msi/rqbit-desktop_*_x64_en-US.msi
          if-no-files-found: error

      - name: Build release
        run: cargo build --profile release-github

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cli-windows
          path: target/release-github/rqbit.exe
          if-no-files-found: error

  release-macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Tauri
        run: cargo install tauri-cli --locked --version 2.8.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend workspace dependencies
        run: npm ci

      - name: cargo tauri build
        working-directory: desktop
        run: |
          rustup target add aarch64-apple-darwin && rustup target add x86_64-apple-darwin &&
          cargo tauri build --target universal-apple-darwin --ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop-macos
          path: target/universal-apple-darwin/release/bundle/dmg/rqbit-desktop_*_universal.dmg
          if-no-files-found: error

      - name: Make a directory for output artifacts
        run: mkdir -p target/artifacts

      - name: Build release OSX universal binary
        run: |
          rustup target install aarch64-apple-darwin &&
          cargo build --profile release-github --target x86_64-apple-darwin &&
          cargo build --profile release-github --target aarch64-apple-darwin &&
          lipo ./target/x86_64-apple-darwin/release-github/rqbit ./target/aarch64-apple-darwin/release-github/rqbit -create -output ./target/artifacts/rqbit-osx-universal

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cli-macos
          path: target/artifacts/rqbit-osx-universal
          if-no-files-found: error

  build-push-docker-multiarch:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [check-version, build-docker-cross]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check whether this is the current main commit
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/mallone2000/rqbit
            ${{ vars.DOCKERHUB_USERNAME }}/rqbit, enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ steps.current.outputs.value }}
            type=raw,value=latest,enable=${{ steps.current.outputs.value }}
            type=raw,value=${{ needs.check-version.outputs.tag }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-arm-v7
          path: target/cross/linux/arm/v7/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-arm64
          path: target/cross/linux/arm64/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-amd64
          path: target/cross/linux/amd64/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Smoke test image as a non-root user
        run: |
          docker build --platform linux/amd64 -f docker/Dockerfile -t rqbit:nonroot-smoke target/cross/
          test_dir=$(mktemp -d)
          trap 'sudo rm -rf "$test_dir"' EXIT
          mkdir -p "$test_dir/db" "$test_dir/cache" "$test_dir/downloads"
          sudo chown -R 1001:1000 "$test_dir"
          container=$(docker run --rm -d --user 1001:1000 \
            -e RQBIT_HTTP_BASIC_AUTH_USERPASS=smoke:test \
            -p 127.0.0.1::3030 \
            -v "$test_dir/db:/home/rqbit/db" \
            -v "$test_dir/cache:/home/rqbit/cache" \
            -v "$test_dir/downloads:/data" \
            rqbit:nonroot-smoke server start /data)
          trap 'docker logs "$container" || true; docker rm -f "$container" || true; sudo rm -rf "$test_dir"' EXIT
          port=$(docker port "$container" 3030/tcp | awk -F: 'END { print $NF }')
          for attempt in {1..30}; do
            if curl --silent --show-error --fail --output /dev/null \
              --user smoke:test "http://127.0.0.1:$port/torrents"; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: "${{ vars.DOCKERHUB_USERNAME != '' }}"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          context: target/cross/
          file: docker/Dockerfile

  publish-release:
    needs:
      - check-version
      - release-linux
      - release-windows
      - release-macos
      - build-push-docker-multiarch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish compiled packages as latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          test -f release-assets/rqbit-linux-amd64
          test -f release-assets/rqbit-linux-arm64
          test -f release-assets/rqbit-linux-arm-v7
          test -f release-assets/rqbit.exe
          test -f release-assets/rqbit-osx-universal
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            latest_flag=--latest
          else
            latest_flag=--latest=false
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "$latest_flag"
