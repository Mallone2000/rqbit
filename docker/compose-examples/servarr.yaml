services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY:?set the NordVPN WireGuard private key}"
      # Keep credentials and server selection from your existing stack.
      # If needed, merge 3030,7878,8989 into FIREWALL_INPUT_PORTS.
    ports:
      # Keep the plaintext admin interfaces local to the Docker host. Put an
      # authenticated HTTPS reverse proxy in front if remote access is needed.
      - "127.0.0.1:3030:3030" # rqbit Web UI/API
      - "127.0.0.1:7878:7878" # Radarr UI
      - "127.0.0.1:8989:8989" # Sonarr UI
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  rqbit:
    image: ${RQBIT_IMAGE:?set this to an rqbit image containing Servarr compatibility}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      RQBIT_QBITTORRENT_API_ENABLE: "true"
      RQBIT_HTTP_API_LISTEN_ADDR: "0.0.0.0:3030"
      RQBIT_HTTP_BASIC_AUTH_USERPASS: "${RQBIT_USER:?}:${RQBIT_PASSWORD:?}"
      RQBIT_SESSION_PERSISTENCE_LOCATION: /home/rqbit/db/session
    command: ["server", "start", "/data/downloads/torrents"]
    volumes:
      - rqbit-db:/home/rqbit/db
      - rqbit-cache:/home/rqbit/cache
      - ${DATA_ROOT:?set the shared host data root}:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      rqbit:
        condition: service_started
    volumes:
      - sonarr-config:/config
      - ${DATA_ROOT:?set the shared host data root}:/data
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      rqbit:
        condition: service_started
    volumes:
      - radarr-config:/config
      - ${DATA_ROOT:?set the shared host data root}:/data
    restart: unless-stopped

volumes:
  rqbit-db: {}
  rqbit-cache: {}
  sonarr-config: {}
  radarr-config: {}
