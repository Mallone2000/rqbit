services:
  rqbit:
    image: ghcr.io/mallone2000/rqbit:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      # Keep the plaintext management API private, even without the TLS overlay.
      - "127.0.0.1:3030:3030"
      - "4240:4240/tcp"
      - "4240:4240/udp"
    environment:
      RQBIT_HTTP_API_LISTEN_ADDR: "0.0.0.0:3030"
      RQBIT_HTTP_API_INSECURE_COOKIES: "false"
      # Bridge networking does not support LAN multicast discovery.
      RQBIT_UPNP_SERVER_ENABLE: "false"
      RQBIT_UPNP_PORT_FORWARD_DISABLE: "true"
      # Required on every listener, including loopback and read-only mode.
      RQBIT_HTTP_BASIC_AUTH_USERPASS: "${RQBIT_USER:?}:${RQBIT_PASSWORD:?}"
    volumes:
      - db:/home/rqbit/db
      - cache:/home/rqbit/cache
      # Replace /tmp/scratch with your downloads folder
      - /tmp/scratch:/home/rqbit/downloads

volumes:
  db: {}
  cache: {}
