[package]
name = "librqbit-sha1-wrapper"
version.workspace = true
edition = "2024"
description = "Common interface around various sha1 implementations used in rqbit torrent client."
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit-sha1-wrapper"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html#

[features]
default = ["sha1-crypto-hash"]
# Keep the public feature name for downstream compatibility while using the
# maintained RustCrypto implementation.
sha1-crypto-hash = ["sha1", "sha2"]
sha1-ring = ["aws-lc-rs"]

[dependencies]
assert_cfg.workspace = true
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
